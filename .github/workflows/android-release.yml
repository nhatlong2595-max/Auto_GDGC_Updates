name: Build and publish Auto_GDGC

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 4.2.0"
        required: true
        default: "4.2.0"
      version_code:
        description: "Android versionCode; must be greater than the installed app"
        required: true
        default: "6"
      release_notes:
        description: "Short release notes"
        required: true
        default: "Auto_GDGC update"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public update repository
        uses: actions/checkout@v5

      - name: Check required configuration
        shell: bash
        env:
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$SOURCE_REPO" || { echo "::error::Set repository variable SOURCE_REPO."; exit 1; }
          test -n "$SOURCE_TOKEN" || { echo "::error::Set repository secret SOURCE_REPO_TOKEN."; exit 1; }
          test -n "$DEBUG_KEYSTORE" || { echo "::error::Set repository secret DEBUG_KEYSTORE_BASE64."; exit 1; }

      - name: Checkout private Android source
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source-repo

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS="$(find source-repo -type f -name settings.gradle.kts -not -path '*/.gradle/*' | head -n 1)"
          test -n "$SETTINGS" || { echo "::error::No settings.gradle.kts found in private source repo."; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "::error::app/build.gradle.kts not found beside settings.gradle.kts."; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore the exact existing debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Set version and build APK
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = ' + os.environ["APP_VERSION_CODE"], s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "' + os.environ["APP_VERSION"] + '"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set versionCode/versionName in app/build.gradle.kts")
          p.write_text(s)
          PY
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "::error::APK output not found."; exit 1; }
          cp "$APK" Auto_GDGC.apk
          sha256sum Auto_GDGC.apk > Auto_GDGC.apk.sha256

      - name: Publish full APK release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v$VERSION" Auto_GDGC.apk Auto_GDGC.apk.sha256 --title "Auto_GDGC v$VERSION" --notes "$NOTES" --latest

      - name: Update public manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          NOTES: ${{ inputs.release_notes }}
          REPOSITORY: ${{ github.repository }}
        run: |
          APK_URL="https://github.com/$REPOSITORY/releases/latest/download/Auto_GDGC.apk"
          APK_SHA="$(cut -d ' ' -f 1 Auto_GDGC.apk.sha256)"
          export APK_URL APK_SHA
          python3 - <<'PY'
          import json, os
          manifest = {
              "app": "Auto_GDGC",
              "latestVersion": os.environ["VERSION"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "releaseNotes": os.environ["NOTES"],
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["APK_SHA"],
              "forceFullApk": True
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          FILE_SHA="$(gh api "repos/$REPOSITORY/contents/update.json" --jq .sha)"
          CONTENT="$(base64 -w 0 update.json)"
          gh api --method PUT "repos/$REPOSITORY/contents/update.json" \
            -f message="Update manifest for v$VERSION" \
            -f content="$CONTENT" \
            -f sha="$FILE_SHA" \
            -f branch="main"
